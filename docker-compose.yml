# YARP UI — template compose file (community edition).
#
#   podman compose up -d    →  http://localhost:8090  (default sign-in: admin / yarp-admin)
#
# The image is pulled from Docker Hub (no local build needed):
#   docker.io/amrfswalha/yarp-ui:latest
#
# Data lives in the external volume `yarp-ui-config` and survives `podman compose down`.
# Create it once if it does not exist yet:  podman volume create yarp-ui-config
#   /var/lib/containers/storage/volumes/yarp-ui-config/_data/appsettings.json
#                                      — credentials (YarpUi:Auth) + the seed ReverseProxy config.
#   .../yarp-ui.routes.json            — written automatically whenever you save from the UI.

services:
  yarp-ui:
    image: docker.io/amrfswalha/yarp-ui:latest
    container_name: yarp-ui
    # The published image's ENTRYPOINT references YARPUI.dll, but the app
    # assembly in /app is YARPUI.Host.dll — override until the image is fixed.
    entrypoint: ["dotnet", "YARPUI.Host.dll"]
    ports:
      - "8090:8080"
    volumes:
      # - ./docker-data:/app/data
      # Named-volume alternative (data survives even if the folder is deleted):
      - yarp-ui-config:/app/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped

volumes:
    yarp-ui-config:
      external: true
