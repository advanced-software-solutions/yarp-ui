name: docker

# Manual dispatch only, restricted to master in the branch picker.
on:
  workflow_dispatch:
    branches:
      - master
    inputs:
      version:
        description: "Image tag to publish (e.g. 0.1.3). Leave empty to use <Version> from YARPUI/YARPASUI.csproj."
        required: false
        default: ""
        type: string

jobs:
  docker:
    name: Build and publish YARPUI.Host image to Docker Hub
    # Hard guard: the branches filter above only limits the picker; this stops
    # an older copy of this workflow on another branch from publishing.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version priority: workflow input > <Version> in YARPUI/YARPASUI.csproj.
      # The image and the NuGet package release in lockstep when no input is given.
      - name: Determine version tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "Using version from workflow input: ${VERSION}"
          else
            VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' YARPUI/YARPASUI.csproj)
            echo "Using <Version> from YARPUI/YARPASUI.csproj: ${VERSION}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$'; then
            echo "Invalid image tag '$VERSION'" >&2
            exit 1
          fi
          echo "IMAGE_TAG=${VERSION}" >> "$GITHUB_ENV"
          echo "Image tags: ${VERSION}, latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Credentials live in repo secrets (DOCKER_USERNAME / DOCKER_TOKEN),
      # never in the repository.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            amrfswalha/yarp-ui:${{ env.IMAGE_TAG }}
            amrfswalha/yarp-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
