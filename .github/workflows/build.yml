name: build

# Tests run on every push and pull request so regressions are noticed immediately.
# Publishing stays manual-dispatch only, restricted to master in the branch picker,
# and additionally waits for the tests to pass (needs: test).
on:
  push:
  pull_request:
  workflow_dispatch:
    branches:
      - master

jobs:
  test:
    name: Run YARPASUI.Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore YARPASUI.Tests/YARPASUI.Tests.csproj

      - name: Build
        run: dotnet build YARPASUI.Tests/YARPASUI.Tests.csproj --configuration Release --no-restore

      # Scenarios tagged @windows (NTFS ACL simulation) skip themselves on Linux.
      - name: Test
        run: >-
          dotnet test YARPASUI.Tests/YARPASUI.Tests.csproj
          --configuration Release --no-build
          --logger trx --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.trx

  build-and-publish:
    name: Build and publish YARPUI to nuget.org
    needs: test
    # Hard guard: publishing only happens on an explicit dispatch of master (the branches
    # filter above only limits the picker), never from a push/PR run, and only after
    # the test job is green.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Must match the environment name in the nuget.org trusted publishing policy.
    environment: production
    permissions:
      id-token: write # required for OIDC token issuance (trusted publishing)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore YARPUI/YARPASUI.csproj

      - name: Build
        run: dotnet build YARPUI/YARPASUI.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack YARPUI/YARPASUI.csproj --configuration Release --no-build --output artifacts

      # Keep the package even if the push below fails, so it can be inspected.
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      # Exchanges the GitHub OIDC token for a temp API key valid for 1 hour,
      # so this step must run right before the push.
      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: amr.swalha # nuget.org profile name, not an email address

      - name: Push to nuget.org
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
